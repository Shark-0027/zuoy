[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "finguard"
version = "0.1.0"
description = "FinGuard — evidence-based financial diagnosis Agent for classroom demonstrations"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "FinGuard" }]
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.8,<3",
  "pandas>=2.2,<3",
  "openpyxl>=3.1,<4",
  "pypdf>=5.0,<6",
  "python-multipart>=0.0.9,<1",
  "httpx>=0.27,<1",
  "python-dotenv>=1.0,<2",
]

[project.scripts]
finguard = "finguard.main:run"

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=5,<7",
  "reportlab>=4.2,<5",
  "ruff>=0.6,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/finguard"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008", "E501"]
